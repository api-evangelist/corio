name: Corio, Inc.
description: 'Corio, Inc. was an enterprise Application Service Provider (ASP) founded in September 1998
  in San Carlos, California, and incorporated in Delaware, formed by acquiring the capital stock of Data
  Systems Connectors, Inc. Corio implemented, hosted and managed packaged enterprise business software
  from Oracle, PeopleSoft, SAP, Ariba and Siebel Systems on behalf of medium and large public, private,
  non-profit and public sector customers, delivering ERP, CRM and e-business functionality as a service
  from secure third-party data centers over IP networks. The company operated two lines of business —
  Application Management Services and Professional Services — and partnered with (i)Structure, XO
  Communications and Qwest for data center and network infrastructure. Backed by Kleiner Perkins Caufield
  & Byers (29.5% pre-IPO across the KPCB Java Fund, KPCB VIII, KPCB VIII Founders Fund and KPCB
  Information Sciences Zaibatsu Fund II, with Vinod Khosla and Ted Schlein on the board) and Cap Gemini
  Ernst & Young, Corio went public on NASDAQ in 2000. IBM agreed to acquire Corio on 24 January 2005 for
  $2.82 per share in cash via Nike Acquisition Corp.; Corio filed its Form 15 deregistration on 15 March
  2005 and was absorbed into IBM. The company is defunct, publishes no API, developer portal or
  documentation, and corio.com is a parked domain — there is no API surface to enrich.'
